$kind: http-request
url: "{{baseUrl}}/api/agences/{{agenceId}}"
method: PUT
body:
  type: json
  content: |-
    {
      "nom": "AutoLoc Tunis Centre",
      "ville": "Tunis",
      "adresse": "12 avenue Habib Bourguiba",
      "telephone": "71111111"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("Valeur modifiée", () => pm.expect(pm.response.json().telephone).to.eql("71111111"));
    language: text/javascript
order: 6000
