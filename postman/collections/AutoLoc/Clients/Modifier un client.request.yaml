$kind: http-request
url: "{{baseUrl}}/api/clients/{{clientId}}"
method: PUT
body:
  type: json
  content: |-
    {
      "nom": "Ben Salah",
      "prenom": "Amine",
      "email": "client{{$timestamp}}{{$randomInt}}@mail.tn",
      "telephone": "22111111",
      "numPermis": "P{{$timestamp}}{{$randomInt}}",
      "dateInscription": "2026-10-23"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("Valeur modifiée", () => pm.expect(pm.response.json().telephone).to.eql("22111111"));
    language: text/javascript
order: 6000
