$kind: http-request
url: "{{baseUrl}}/api/clients/9999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 404", () => pm.response.to.have.status(404));
      pm.test("Corps d'erreur", () => pm.expect(pm.response.json()).to.have.keys("statut", "message", "horodatage"));
    language: text/javascript
order: 4000
