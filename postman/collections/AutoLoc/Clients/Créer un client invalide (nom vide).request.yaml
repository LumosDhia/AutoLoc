$kind: http-request
url: "{{baseUrl}}/api/clients"
method: POST
body:
  type: json
  content: |-
    {
      "nom": "",
      "prenom": "Amine",
      "email": "client{{$timestamp}}{{$randomInt}}@mail.tn",
      "telephone": "22000000",
      "numPermis": "P{{$timestamp}}{{$randomInt}}",
      "dateInscription": "2026-10-23"
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
