$kind: http-request
url: "{{baseUrl}}/api/equipements"
method: POST
body:
  type: json
  content: |-
    {
      "libelle": "GPS"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.environment.set("equipementId", pm.response.json().idEquipement);
    language: text/javascript
order: 2000
