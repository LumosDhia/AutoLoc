$kind: http-request
url: "{{baseUrl}}/api/paiements"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("Paiements créés par cascade", () => {
          const ids = pm.response.json().map(p => p.idPaiement);
          pm.expect(ids).to.include(Number(pm.environment.get("paiementId")));
      });
    language: text/javascript
order: 1000
