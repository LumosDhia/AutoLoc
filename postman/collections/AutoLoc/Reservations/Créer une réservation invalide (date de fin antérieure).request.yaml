$kind: http-request
url: "{{baseUrl}}/api/reservations"
method: POST
body:
  type: json
  content: |-
    {
      "dateDebut": "2026-11-02",
      "dateFin": "2026-11-01",
      "statut": "EN_ATTENTE",
      "client": {
        "idClient": {{clientId}}
      },
      "vehicule": {
        "idVehicule": {{vehiculeId}}
      }
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
