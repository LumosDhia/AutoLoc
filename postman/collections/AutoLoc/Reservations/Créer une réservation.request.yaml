$kind: http-request
url: "{{baseUrl}}/api/reservations"
method: POST
body:
  type: json
  content: |-
    {
      "dateDebut": "2026-11-02",
      "dateFin": "2026-11-06",
      "statut": "EN_ATTENTE",
      "client": {
        "idClient": {{clientId}}
      },
      "vehicule": {
        "idVehicule": {{vehiculeId}}
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.environment.set("reservationId", pm.response.json().idReservation);
    language: text/javascript
order: 2000
