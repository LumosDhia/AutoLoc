$kind: http-request
url: "{{baseUrl}}/api/contrats/{{contratId}}"
method: PUT
body:
  type: json
  content: |-
    {
      "dateSignature": "2026-11-02",
      "montantTotal": 520.0,
      "valide": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("Valeur modifiée", () => pm.expect(pm.response.json().montantTotal).to.eql(520.0));
    language: text/javascript
order: 9000
