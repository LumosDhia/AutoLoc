$kind: http-request
url: "{{baseUrl}}/api/contrats/{{contratId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("Identifiant", () => pm.expect(pm.response.json().idContrat).to.eql(Number(pm.environment.get("contratId"))));
    language: text/javascript
order: 3000
