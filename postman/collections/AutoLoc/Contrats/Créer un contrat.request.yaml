$kind: http-request
url: "{{baseUrl}}/api/contrats"
method: POST
body:
  type: json
  content: |-
    {
      "dateSignature": "2026-11-02",
      "montantTotal": 480.0,
      "valide": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.environment.set("contratId", pm.response.json().idContrat);
    language: text/javascript
order: 2000
