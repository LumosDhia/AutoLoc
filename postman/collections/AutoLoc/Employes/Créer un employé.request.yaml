$kind: http-request
url: "{{baseUrl}}/api/employes"
method: POST
body:
  type: json
  content: |-
    {
      "nom": "Trabelsi",
      "prenom": "Sana",
      "role": "AGENT",
      "agence": {
        "idAgence": {{agenceId}}
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.environment.set("employeId", pm.response.json().idEmploye);
    language: text/javascript
order: 2000
