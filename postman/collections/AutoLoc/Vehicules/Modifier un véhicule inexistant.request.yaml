$kind: http-request
url: "{{baseUrl}}/api/vehicules/9999"
method: PUT
body:
  type: json
  content: |-
    {
      "immatriculation": "TU-{{$timestamp}}{{$randomInt}}",
      "marque": "Peugeot",
      "modele": "208",
      "categorie": "CITADINE",
      "tarifJournalier": 95.0,
      "statut": "DISPONIBLE",
      "agence": {
        "idAgence": {{agenceId}}
      }
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 7000
