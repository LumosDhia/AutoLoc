$kind: http-request
url: "{{baseUrl}}/api/vehicules"
method: POST
body:
  type: json
  content: |-
    {
      "immatriculation": "TU-{{$timestamp}}{{$randomInt}}",
      "marque": "Peugeot",
      "modele": "208",
      "categorie": "CITADINE",
      "tarifJournalier": -10,
      "statut": "DISPONIBLE",
      "agence": {
        "idAgence": {{agenceId}}
      }
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
